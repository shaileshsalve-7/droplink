spring.application.name=droplink
server.port=${PORT:8080}
# Vite forwards browser requests here. Keep the backend local during local development.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Multipart parsing spools to disk; the application streams into its owned store.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=0
# Dedicated directory: only DropLink should write here. Never use a personal folder.
droplink.files.directory=${DROPLINK_STORAGE_DIR:${java.io.tmpdir}/droplink-files}
# Do not expose stack traces or exception messages in HTTP error responses.
server.error.include-message=never
server.error.include-stacktrace=never

# Fixed from creation; joining does not extend expiry. Use PT10S for a local expiry check.
droplink.rooms.ttl=${ROOM_TTL:PT30M}
droplink.rooms.max-rooms=100
droplink.rooms.max-members=8
