spring.application.name=droplink
server.port=${PORT:8080}
# Vite forwards browser requests here. Keep the backend local during Day 1.
server.address=${SERVER_ADDRESS:127.0.0.1}

# No upload endpoint exists yet. Limits and cleanup arrive with temporary storage.
# Do not expose stack traces or exception messages in HTTP error responses.
server.error.include-message=never
server.error.include-stacktrace=never
