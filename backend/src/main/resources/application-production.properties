# One process serves the React bundle, HTTP API, and WebSocket endpoint.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:10000}
# Required in production. Render injects its HTTPS URL; other hosts must supply it.
droplink.public-origin=${DROPLINK_PUBLIC_ORIGIN:${RENDER_EXTERNAL_URL}}
# Keep the real peer address for admission limits. Do not trust forwarded IPs.
server.forward-headers-strategy=none
spring.web.resources.cache.cachecontrol.no-store=true
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=256
server.tomcat.accept-count=50
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
